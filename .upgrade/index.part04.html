function normalizePasswordValue(value){
  let v=String(value||'').replace(/[\u200B-\u200D\u2060\uFEFF]/g,'').trim();
  if(v.length>=2&&((v.startsWith('"')&&v.endsWith('"'))||(v.startsWith("'")&&v.endsWith("'"))))v=v.slice(1,-1).trim();
  return v;
}
