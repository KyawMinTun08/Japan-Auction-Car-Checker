<style>
:root{--brand:#C8102E;--brand-2:#9F0E26;--brand-3:#7A0A1D;--brand-soft:#FEF2F4;--brand-glow:rgba(200,16,46,0.14);--ink-1:#0A0E1A;--ink-2:#1C1917;--ink-3:#44403C;--ink-4:#78716C;--ink-5:#A8A29E;--bg:#F4F1EC;--surface:#FFFFFF;--surface-2:#FAFAF7;--surface-3:#F0EDE7;--line:#E7E5E4;--line-soft:#F0EDE7;--line-strong:#D6D3D1;--ok:#15803D;--ok-soft:#DCFCE7;--warn:#B45309;--warn-soft:#FEF3C7;--bad:#B91C1C;--bad-soft:#FEE2E2;--info:#1D4ED8;--info-soft:#DBEAFE;--gold:#B45309;--r-sm:6px;--r-md:10px;--r-lg:14px;--r-xl:20px;--sh-sm:0 1px 2px rgba(28,25,23,.04),0 1px 1px rgba(28,25,23,.03);--sh-md:0 4px 12px rgba(28,25,23,.06),0 1px 3px rgba(28,25,23,.04);--sh-lg:0 12px 32px rgba(28,25,23,.10),0 4px 8px rgba(28,25,23,.04);--sh-brand:0 8px 24px rgba(200,16,46,.20);--sidebar-w:240px;--header-h:60px;--font-sans:'Outfit','Noto Sans Myanmar',-apple-system,BlinkMacSystemFont,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,monospace}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--font-sans);background:var(--bg);color:var(--ink-2);display:flex;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.login-bg{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at 20% 0%,rgba(200,16,46,0.08),transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(10,14,26,0.05),transparent 50%),var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.login-bg::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(28,25,23,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(28,25,23,.025) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
.login-card{position:relative;z-index:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:36px 32px 28px;width:100%;max-width:400px;box-shadow:var(--sh-lg)}
.login-stamp{position:absolute;top:-18px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;padding:6px 14px;border-radius:var(--r-sm);font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;box-shadow:var(--sh-brand)}
.login-logo{text-align:center;margin-bottom:24px}
.login-mark{width:56px;height:56px;background:var(--ink-1);border-radius:var(--r-md);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;position:relative}
.login-mark::before{content:'';position:absolute;width:24px;height:24px;background:var(--brand);border-radius:50%}
.login-title{font-size:19px;font-weight:800;color:var(--ink-1);letter-spacing:-0.4px;line-height:1.2}
.login-title em{font-style:normal;color:var(--brand)}
.login-sub{font-size:11px;color:var(--ink-4);margin-top:6px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600}
.login-field{margin-bottom:14px}
.login-label{display:block;font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.login-input{width:100%;background:var(--surface-2);border:1.5px solid var(--line);border-radius:var(--r-md);padding:13px 16px;font-size:15px;font-family:var(--font-mono);font-weight:600;letter-spacing:1.5px;color:var(--ink-1);outline:none;transition:all 0.18s}
.login-input::placeholder{color:var(--ink-5);letter-spacing:normal;font-family:var(--font-sans);font-weight:500}
.login-input:focus{background:var(--surface);border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-glow)}
.login-err{display:none;background:var(--bad-soft);border:1px solid #FCA5A5;border-radius:var(--r-md);padding:10px 14px;font-size:13px;color:var(--bad);margin-bottom:14px;text-align:center;font-weight:500}
.login-btn{width:100%;background:var(--ink-1);color:#fff;border:none;border-radius:var(--r-md);padding:14px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font-sans);letter-spacing:0.5px;text-transform:uppercase;transition:all 0.18s;position:relative;overflow:hidden}
.login-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--brand),var(--brand-2));opacity:0;transition:opacity 0.2s}
.login-btn:hover::before{opacity:1}
.login-btn:hover{transform:translateY(-1px);box-shadow:var(--sh-brand)}
.login-btn:active{transform:translateY(0)}
.login-btn span{position:relative;z-index:1}
.login-btn:disabled{opacity:0.6;cursor:not-allowed}
.login-btn:disabled:hover{transform:none;box-shadow:none}
.login-hint{margin-top:18px;text-align:center;font-size:12px;color:var(--ink-4);line-height:1.6}
.login-hint a{color:var(--brand);font-weight:600;text-decoration:none;font-family:var(--font-mono)}
.login-hint a:hover{text-decoration:underline}
.login-brute{display:none;margin-top:12px;text-align:center;font-size:12px;color:var(--bad);font-weight:600;background:var(--bad-soft);padding:8px 12px;border-radius:var(--r-sm)}
.login-promo{margin-top:22px;border-top:1px solid var(--line-soft);padding-top:18px}
.login-promo-tag{font-size:10px;color:var(--ink-5);text-align:center;margin-bottom:10px;text-transform:uppercase;letter-spacing:1.5px;font-weight:600}
.login-promo-card{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--ink-1) 0%,#1A2030 100%);border-radius:var(--r-md);padding:14px 16px;text-decoration:none;border:1px solid rgba(255,255,255,0.06);transition:transform 0.2s}
.login-promo-card:hover{transform:translateY(-2px)}
.login-promo-icon{width:38px;height:38px;background:var(--brand);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.login-promo-text{flex:1;min-width:0}
.login-promo-title{font-size:13px;font-weight:700;color:#fff}
.login-promo-sub{font-size:11px;color:rgba(255,255,255,0.6);margin-top:2px}
.login-promo-cta{font-size:11px;color:var(--brand);font-weight:700;margin-top:4px}
.load-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999}
.load-mark{width:64px;height:64px;background:var(--ink-1);border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.load-mark::before{content:'';width:28px;height:28px;background:var(--brand);border-radius:50%;animation:pulse-dot 1.4s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:0.7}}
.load-text{font-size:13px;color:var(--ink-3);font-weight:500}
.load-sub{font-size:11px;color:var(--ink-5);margin-top:6px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600}
.sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,#0A0E1A 0%,#14182A 100%);display:flex;flex-direction:column;height:100vh;position:fixed;left:0;top:0;z-index:300;overflow-y:auto;border-right:1px solid rgba(255,255,255,0.04)}
.side-brand{padding:22px 18px 20px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:12px}
.side-mark{width:38px;height:38px;background:var(--surface);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.side-mark::before{content:'';width:18px;height:18px;background:var(--brand);border-radius:50%}
.side-brand-text{min-width:0}
.side-brand-title{font-size:14px;font-weight:800;color:#fff;letter-spacing:-0.3px;line-height:1.1}
.side-brand-title em{font-style:normal;color:var(--brand);font-weight:800}
.side-brand-sub{font-size:9px;color:rgba(255,255,255,0.4);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;font-weight:600}
.side-section{padding:16px 12px 4px}
.side-label{font-size:9.5px;font-weight:700;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:1.5px;padding:0 10px;margin-bottom:6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-sm);color:rgba(255,255,255,0.65);font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s;margin-bottom:1px;border:1px solid transparent}
.nav-item:hover{background:rgba(255,255,255,0.05);color:#fff}
.nav-item.active{background:rgba(200,16,46,0.12);color:#fff;border-color:rgba(200,16,46,0.3)}
.nav-item .icon{width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--brand);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;font-family:var(--font-mono)}
.side-footer{margin-top:auto;padding:14px 12px;border-top:1px solid rgba(255,255,255,0.06)}
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.header{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;flex-shrink:0;position:relative}
.header::after{content:'';position:absolute;bottom:-1px;left:0;width:80px;height:2px;background:var(--brand)}
.header-brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.header-mark{width:36px;height:36px;background:var(--ink-1);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.header-mark::before{content:'';width:16px;height:16px;background:var(--brand);border-radius:50%}
.header-text{min-width:0;flex:1}
.header-tag{font-size:9px;font-weight:700;color:var(--ink-4);text-transform:uppercase;letter-spacing:1.5px;line-height:1;margin-bottom:2px}
.header-title{font-size:15px;font-weight:800;color:var(--ink-1);letter-spacing:-0.3px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-title em{font-style:normal;color:var(--brand)}
