name: Phase 2 validate once

on:
  push:
    branches:
      - agent/jacc-phase2-membership-audit
    paths:
      - .github/workflows/phase2-validate-once.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out synchronized Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/jacc-phase2-membership-audit
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r phase1/requirements_phase1.txt pytest

      - name: Compile Phase 1 and staged Phase 2 files
        run: |
          python -m py_compile \
            phase1_production_launcher.py \
            phase1_healthcheck.py \
            phase1_selftest.py \
            phase1_broker_sync.py \
            phase1_resilience_test.py \
            phase1_final_pilot.py \
            phase1_final_pilot_guard.py \
            phase2_membership_guard.py \
            phase2/apply_apps_script_code_gs.py \
            phase2/apply_apps_script_payment_gs.py \
            phase2/apply_apps_script_registration_gs.py \
            phase2/apply_apps_script_phase3_payments_gs.py \
            phase2/apply_website_device_binding.py \
            phase2/build_release_candidate_bundle.py \
            queue_launcher.py \
            bot.py \
            bot_core.py \
            phase1/phase1_client.py \
            phase1/phase1_worker.py \
            phase1/recovery_worker.py

      - name: Verify merged website contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'data-jacc-device-binding="v4"' index.html
          grep -F "JACCDeviceBinding.withDevice('verifyLogin'" index.html
          grep -F "JACCDeviceBinding.withDevice('getData'" index.html
          grep -F 'async function restoreSession()' index.html
          grep -F 'function normalizePasswordValue(value)' index.html
          grep -F "navigator.serviceWorker.register('./sw.js'" index.html
          grep -F 'const APP_VERSION' index.html
          python phase2/apply_website_device_binding.py index.html --check
          git diff --exit-code -- index.html

      - name: Run Phase 1 and staged Phase 2 tests
        run: python -m pytest phase1/tests -q

      - name: Remove one-time validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/phase2-validate-once.yml
          git commit -m 'ci: remove completed Phase 2 validation workflow'
          git push origin HEAD:agent/jacc-phase2-membership-audit
