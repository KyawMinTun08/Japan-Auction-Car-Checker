name: Phase 2 sync main once

on:
  push:
    branches:
      - agent/jacc-phase2-membership-audit
    paths:
      - .github/workflows/phase2-sync-main.yml

permissions:
  contents: write

jobs:
  sync-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/jacc-phase2-membership-audit
          fetch-depth: 0

      - name: Run reviewed sync script with corrected staging
        shell: bash
        run: |
          set -euo pipefail
          git show 4f5375f3b191463b764fd0fcb3b78fae56828024:.github/workflows/phase2-sync-main.yml > /tmp/original-sync.yml
          python - <<'PY'
          from pathlib import Path

          source = Path('/tmp/original-sync.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          if marker not in source:
              raise RuntimeError('reviewed sync script marker not found')

          script = source.split(marker, 1)[1]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in script.splitlines()
          ) + '\n'

          old = 'git add index.html legacy_bot.py manifest.json sw.js robots.txt phase2/MEMBERSHIP_CHANNEL_AUDIT.md 2>/dev/null || true'
          if script.count(old) != 1:
              raise RuntimeError('reviewed staging command drifted')
          script = script.replace(old, 'git add -A', 1)
          Path('/tmp/phase2-sync.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/phase2-sync.sh
