# Re-triggered after synchronizing the Phase 1 branch with main.
name: Phase 1 CI

on:
  pull_request:
    paths:
      - "index.html"
      - "bot.py"
      - "bot_core.py"
      - "legacy_bot.py"
      - "queue_launcher.py"
      - "safe_queue_launcher.py"
      - "phase1_production_launcher.py"
      - "phase2_production_launcher.py"
      - "phase1_healthcheck.py"
      - "phase1_selftest.py"
      - "phase1_broker_sync.py"
      - "phase1_resilience_test.py"
      - "phase1_final_pilot.py"
      - "phase1_final_pilot_guard.py"
      - "phase2_membership_guard.py"
      - "phase1/**"
      - "phase2/**"
      - "phase3/**"
      - ".github/workflows/phase1-ci.yml"
  push:
    branches:
      - main
      - agent/jacc-phase1-foundation
      - agent/jacc-phase2-membership-audit
      - agent/jacc-phase3-app-chat
    paths:
      - "index.html"
      - "bot.py"
      - "bot_core.py"
      - "legacy_bot.py"
      - "queue_launcher.py"
      - "safe_queue_launcher.py"
      - "phase1_production_launcher.py"
      - "phase2_production_launcher.py"
      - "phase1_healthcheck.py"
      - "phase1_selftest.py"
      - "phase1_broker_sync.py"
      - "phase1_resilience_test.py"
      - "phase1_final_pilot.py"
      - "phase1_final_pilot_guard.py"
      - "phase2_membership_guard.py"
      - "phase1/**"
      - "phase2/**"
      - "phase3/**"
      - ".github/workflows/phase1-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r phase1/requirements_phase1.txt -r phase3/requirements_phase3.txt pytest

      - name: Compile Phase 1, staged Phase 2 and staged Phase 3 files
        run: |
          python -m py_compile \
            phase1_production_launcher.py \
            safe_queue_launcher.py \
            phase2_production_launcher.py \
            phase1_healthcheck.py \
            phase1_selftest.py \
            phase1_broker_sync.py \
            phase1_resilience_test.py \
            phase1_final_pilot.py \
            phase1_final_pilot_guard.py \
            phase2_membership_guard.py \
            phase2/apply_apps_script_code_gs.py \
            phase2/apply_apps_script_payment_gs.py \
            phase2/apply_apps_script_registration_gs.py \
            phase2/apply_apps_script_phase3_payments_gs.py \
            phase2/apply_website_device_binding.py \
            phase2/build_release_candidate_bundle.py \
            phase3/app_chat/apply_app_chat_ui.py \
            phase3/app_chat/service.py \
            queue_launcher.py \
            bot.py \
            bot_core.py \
            phase1/phase1_client.py \
            phase1/phase1_worker.py \
            phase1/recovery_worker.py
          node --check phase3/app_chat/client.js
          node --check phase3/app_chat/ui.js

      - name: Verify generated Phase 2 website contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'data-jacc-device-binding="v4"' index.html
          grep -F "JACCDeviceBinding.withDevice('verifyLogin'" index.html
          grep -F "JACCDeviceBinding.withDevice('getData'" index.html
          grep -F "async function restoreSession()" index.html
          python phase2/apply_website_device_binding.py index.html --check
          git diff --exit-code -- index.html

      - name: Generate and verify staged Phase 3 chat app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/staged
          python phase3/app_chat/apply_app_chat_ui.py \
            index.html \
            --api-base https://jacc-chat.example.invalid \
            --output build/staged/index-chat.html
          python phase3/app_chat/apply_app_chat_ui.py \
            build/staged/index-chat.html \
            --api-base https://jacc-chat.example.invalid \
            --check
          grep -F 'id="nav-chat"' build/staged/index-chat.html
          grep -F 'id="tab-chat"' build/staged/index-chat.html
          grep -F "JACCChatUISetVisible(name==='chat')" build/staged/index-chat.html
          grep -F 'phase3/app_chat/client.js' build/staged/index-chat.html
          grep -F 'phase3/app_chat/ui.js' build/staged/index-chat.html

      - name: Run Phase 1 policy, recovery, staged Phase 2 and staged Phase 3 tests
        run: python -m pytest phase1/tests phase3/tests -q

      - name: Publish staged Phase 2 and Phase 3 release assets
        uses: actions/upload-artifact@v4
        with:
          name: jacc-phase2-phase3-staged-assets
          if-no-files-found: error
          retention-days: 14
          path: |
            index.html
            build/staged/index-chat.html
            safe_queue_launcher.py
            phase2_production_launcher.py
            phase2/
            phase2_membership_guard.py
            phase3/
