# Re-triggered after synchronizing the Phase 1 branch with main.
name: Phase 1 CI

on:
  pull_request:
    paths:
      - "index.html"
      - "bot.py"
      - "bot_core.py"
      - "legacy_bot.py"
      - "queue_launcher.py"
      - "phase1_production_launcher.py"
      - "phase1_healthcheck.py"
      - "phase1_selftest.py"
      - "phase1_broker_sync.py"
      - "phase1_resilience_test.py"
      - "phase1_final_pilot.py"
      - "phase1_final_pilot_guard.py"
      - "phase2_membership_guard.py"
      - "phase1/**"
      - "phase2/**"
      - ".github/workflows/phase1-ci.yml"
  push:
    branches:
      - main
      - agent/jacc-phase1-foundation
      - agent/jacc-phase2-membership-audit
    paths:
      - "index.html"
      - "bot.py"
      - "bot_core.py"
      - "legacy_bot.py"
      - "queue_launcher.py"
      - "phase1_production_launcher.py"
      - "phase1_healthcheck.py"
      - "phase1_selftest.py"
      - "phase1_broker_sync.py"
      - "phase1_resilience_test.py"
      - "phase1_final_pilot.py"
      - "phase1_final_pilot_guard.py"
      - "phase2_membership_guard.py"
      - "phase1/**"
      - "phase2/**"
      - ".github/workflows/phase1-ci.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r phase1/requirements_phase1.txt pytest

      - name: Compile Phase 1 and staged Phase 2 files
        run: |
          python -m py_compile \
            phase1_production_launcher.py \
            phase1_healthcheck.py \
            phase1_selftest.py \
            phase1_broker_sync.py \
            phase1_resilience_test.py \
            phase1_final_pilot.py \
            phase1_final_pilot_guard.py \
            phase2_membership_guard.py \
            phase2/apply_website_device_binding.py \
            queue_launcher.py \
            bot.py \
            bot_core.py \
            phase1/phase1_client.py \
            phase1/phase1_worker.py \
            phase1/recovery_worker.py

      - name: Run Phase 1 policy, recovery, and staged Phase 2 tests
        run: python -m pytest phase1/tests -q

      - name: Generate and commit Phase 2 website once
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/jacc-phase2-membership-audit'
        shell: bash
        run: |
          set -euo pipefail
          python phase2/apply_website_device_binding.py index.html
          if git diff --quiet -- index.html; then
            echo "Phase 2 website already generated"
            exit 0
          fi
          test "$(git diff --name-only)" = "index.html"
          git diff --check
          grep -F 'data-jacc-device-binding="v4"' index.html
          grep -F "async function restoreSession()" index.html
          grep -F "JACCDeviceBinding.withDevice('verifyLogin'" index.html
          grep -F "JACCDeviceBinding.withDevice('getData'" index.html
          python phase2/apply_website_device_binding.py index.html --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          test "$(git diff --cached --name-only)" = "index.html"
          git commit -m "Phase 2: generate device-bound website login"
          git push origin HEAD:agent/jacc-phase2-membership-audit
