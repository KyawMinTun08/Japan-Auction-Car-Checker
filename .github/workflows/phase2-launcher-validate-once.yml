name: Phase 2 launcher validate once

on:
  push:
    branches:
      - agent/jacc-phase2-membership-audit
    paths:
      - .github/workflows/phase2-launcher-validate-once.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/jacc-phase2-membership-audit
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r phase1/requirements_phase1.txt pytest

      - name: Compile launchers and Phase 2 runtime
        run: |
          python -m py_compile \
            phase1_production_launcher.py \
            phase2_production_launcher.py \
            phase2_membership_guard.py \
            phase2/install.py \
            phase2/channel_reactivation.py \
            phase2/legacy_sheet_auth.py \
            phase2/payment_approval.py \
            phase2/payment_callback.py \
            queue_launcher.py \
            legacy_bot.py

      - name: Run complete Phase 1 and staged Phase 2 test suite
        run: python -m pytest phase1/tests -q

      - name: Remove one-time launcher validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/phase2-launcher-validate-once.yml
          git commit -m 'ci: remove completed Phase 2 launcher validation workflow'
          git push origin HEAD:agent/jacc-phase2-membership-audit
