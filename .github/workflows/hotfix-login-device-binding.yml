name: Hotfix Login Device Binding

on:
  push:
    branches:
      - hotfix/login-device-binding-20260807
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/login-device-binding-20260807
          fetch-depth: 0

      - name: Apply exact login device-binding patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'data-jacc-device-binding="v4"' in s:
              print('device binding already applied; validating only')
          else:
              replacements = [
                  (
                      '<script>\nconst SHEET_ID',
                      '<script src="phase2/website_device_binding.js" data-jacc-device-binding="v4"></script>\n<script>\nconst SHEET_ID'
                  ),
                  (
                      "const SESSION_KEY = 'jan_session';\nconst SESSION_VER = 'v3';\n",
                      'const SESSION_KEY = JACCDeviceBinding.SESSION_KEY;\nconst SESSION_VER = JACCDeviceBinding.SESSION_VERSION;\n'
                  ),
                  (
                      'const SESSION_HOURS   = 24;\n',
                      ''
                  ),
                  (
                      "body:JSON.stringify({action:'verifyLogin',password:pw})",
                      "body:JSON.stringify(JACCDeviceBinding.withDevice('verifyLogin',{password:pw}))"
                  ),
                  (
                      "      if(reason==='wrong_password'||reason.includes('password')){",
                      "      if(JACCDeviceBinding.isDeviceError(result)){\n        err.textContent=JACCDeviceBinding.deviceErrorMessage(result);\n      }\n      else if(reason==='wrong_password'||reason.includes('password')){"
                  ),
                  (
                      "    SESSION={ver:SESSION_VER,token:result.token,userId:result.userId,username:result.username,package:result.package,expireDate:result.expireDate,loginTime:Date.now()};\n    sessionStorage.setItem(SESSION_KEY,JSON.stringify(SESSION));",
                      "    SESSION=JACCDeviceBinding.saveSession({token:result.token,userId:result.userId,username:result.username,package:result.package,expireDate:result.expireDate,loginTime:Date.now()});"
                  ),
                  (
                      "function checkSession(){\n  try{\n    const s=sessionStorage.getItem(SESSION_KEY);if(!s)return false;\n    const parsed=JSON.parse(s);if(!parsed||!parsed.token)return false;\n    if(parsed.ver!==SESSION_VER){sessionStorage.removeItem(SESSION_KEY);return false;}\n    if(Date.now()-parsed.loginTime>SESSION_HOURS*3600*1000){sessionStorage.removeItem(SESSION_KEY);return false;}\n    SESSION=parsed;return true;\n  }catch(e){return false;}\n}",
                      "async function restoreSession(){\n  window.JACC_SESSION_ERROR='';\n  const restored=await JACCDeviceBinding.verifyStoredSession({webhook:WEBHOOK});\n  if(restored.ok){SESSION=restored.session;return true;}\n  if(restored.deviceError){\n    window.JACC_SESSION_ERROR=JACCDeviceBinding.deviceErrorMessage(restored.response||{message:restored.reason});\n  }else if(restored.reason==='backend_unavailable'){\n    window.JACC_SESSION_ERROR='⚠️ Login server ကို ဆက်သွယ်မရပါ။ Internet စစ်ပြီး ပြန်ဖွင့်ပါ။';\n  }\n  return false;\n}"
                  ),
                  (
                      "function doLogout(){sessionStorage.removeItem(SESSION_KEY);location.reload();}",
                      "function doLogout(){JACCDeviceBinding.clearSession();location.reload();}"
                  ),
                  (
                      "window.addEventListener('DOMContentLoaded',function(){\n  updateNetworkStatus();registerServiceWorker();\n  const requestedTab=location.hash.replace('#','');\n  if(checkSession()){showApp();if(['dashboard','explorer','price','chassis','trends'].includes(requestedTab))setTimeout(()=>switchTab(requestedTab,false),0);}\n  else{document.getElementById('loginOverlay').style.display='flex';document.getElementById('loadingOverlay').style.display='none';}\n});",
                      "window.addEventListener('DOMContentLoaded',async function(){\n  updateNetworkStatus();registerServiceWorker();\n  const requestedTab=location.hash.replace('#','');\n  const login=document.getElementById('loginOverlay');\n  const loading=document.getElementById('loadingOverlay');\n  loading.style.display='flex';\n  if(await restoreSession()){showApp();if(['dashboard','explorer','price','chassis','trends'].includes(requestedTab))setTimeout(()=>switchTab(requestedTab,false),0);return;}\n  login.style.display='flex';loading.style.display='none';\n  if(window.JACC_SESSION_ERROR){\n    const err=document.getElementById('loginErr');\n    err.textContent=window.JACC_SESSION_ERROR;err.style.display='block';\n  }\n});"
                  ),
                  (
                      "body:JSON.stringify({action:'getData',token:SESSION.token})",
                      "body:JSON.stringify(JACCDeviceBinding.withDevice('getData',{token:SESSION.token,userId:SESSION.userId}))"
                  ),
                  (
                      "    if(result.status!=='ok')throw new Error(result.msg||'Data fetch failed');",
                      "    if(result.status!=='ok'){\n      if(JACCDeviceBinding.isDeviceError(result)){\n        JACCDeviceBinding.clearSession();\n        throw new Error(JACCDeviceBinding.deviceErrorMessage(result));\n      }\n      throw new Error(result.msg||result.message||'Data fetch failed');\n    }"
                  ),
              ]

              for old, new in replacements:
                  count = s.count(old)
                  if count != 1:
                      raise SystemExit(f'exact patch guard failed: expected 1 occurrence, got {count}: {old[:80]!r}')
                  s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          required = [
              'data-jacc-device-binding="v4"',
              "JACCDeviceBinding.withDevice('verifyLogin'",
              "JACCDeviceBinding.withDevice('getData'",
              'async function restoreSession()',
              'JACCDeviceBinding.saveSession(',
              'JACCDeviceBinding.clearSession()',
          ]
          for marker in required:
              if marker not in p.read_text(encoding='utf-8'):
                  raise SystemExit(f'missing required marker: {marker}')
          print('HOTFIX_DEVICE_BINDING_PATCH_OK')
          PY

      - name: Static contract checks
        shell: bash
        run: |
          set -euo pipefail
          test -f phase2/website_device_binding.js
          grep -F 'data-jacc-device-binding="v4"' index.html
          grep -F "JACCDeviceBinding.withDevice('verifyLogin'" index.html
          grep -F "JACCDeviceBinding.withDevice('getData'" index.html
          grep -F "const SESSION_VERSION = 'v4';" phase2/website_device_binding.js
          ! grep -F "JSON.stringify({action:'verifyLogin',password:pw})" index.html
          git diff --check

      - name: Commit patched index only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No index changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'hotfix: send device binding on website login'
          git push origin HEAD:hotfix/login-device-binding-20260807
