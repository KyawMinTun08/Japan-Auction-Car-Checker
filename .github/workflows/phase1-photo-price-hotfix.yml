name: Phase 1 photo price parsing hotfix

on:
  push:
    branches:
      - agent/jacc-phase1-foundation
    paths:
      - .github/workflows/phase1-photo-price-hotfix.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 1
        uses: actions/checkout@v4
        with:
          ref: agent/jacc-phase1-foundation
          fetch-depth: 0

      - name: Patch chassis-safe price parsing
        shell: python
        run: |
          from pathlib import Path

          path = Path("legacy_bot.py")
          text = path.read_text(encoding="utf-8")
          old = '''    chassis      = extract_chassis_from_text(caption) if caption else None
    price_match  = re.search(r'(?<![A-Z0-9])(\\d{4,6})(?![A-Z0-9])', caption.upper()) if caption else None
    price        = int(price_match.group(1)) if price_match else None
'''
          new = '''    chassis = extract_chassis_from_text(caption) if caption else None

    # Parse a standalone price only after removing the detected chassis.
    # This prevents a chassis suffix such as NT31-236260 from being treated
    # as a price. Four-digit model years are skipped as well.
    price_text = (caption or "").upper()
    if chassis:
        price_text = re.sub(re.escape(chassis.upper()), " ", price_text, count=1)

    price_match = None
    for candidate_match in re.finditer(
        r'(?<![A-Z0-9])(\\d{4,6})(?![A-Z0-9])', price_text
    ):
        candidate_price = int(candidate_match.group(1))
        if 1900 <= candidate_price <= 2099:
            continue
        price_match = candidate_match
        break
    price = int(price_match.group(1)) if price_match else None
'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one target block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Validate parsing behavior
        shell: python
        run: |
          import re

          def parse(caption, chassis):
              price_text = (caption or "").upper()
              if chassis:
                  price_text = re.sub(re.escape(chassis.upper()), " ", price_text, count=1)
              for match in re.finditer(r'(?<![A-Z0-9])(\d{4,6})(?![A-Z0-9])', price_text):
                  value = int(match.group(1))
                  if 1900 <= value <= 2099:
                      continue
                  return value
              return None

          assert parse("NT31-236260", "NT31-236260") is None
          assert parse("NT31-236260 150000", "NT31-236260") == 150000
          assert parse("NT31-236260 2010 150000", "NT31-236260") == 150000
          assert parse("2014 NT31-236260", "NT31-236260") is None
          assert parse("NT31-236260 9500", "NT31-236260") == 9500

      - name: Compile production launchers
        run: |
          python -m py_compile legacy_bot.py queue_launcher.py safe_queue_launcher.py

      - name: Run Phase 1 tests
        run: |
          python -m pytest phase1/tests -q

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/phase1-photo-price-hotfix.yml
          git add legacy_bot.py .github/workflows/phase1-photo-price-hotfix.yml
          git commit -m "fix: ignore chassis suffix when parsing photo price"
          git push origin HEAD:agent/jacc-phase1-foundation
