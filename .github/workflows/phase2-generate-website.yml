name: Phase 2 Generate Website

on:
  push:
    branches:
      - agent/jacc-phase2-membership-audit
    paths:
      - ".github/workflows/phase2-generate-website.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/jacc-phase2-membership-audit
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate guarded website patch
        run: python phase2/apply_website_device_binding.py index.html

      - name: Verify generated scope and markers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "index.html"
          grep -F 'data-jacc-device-binding="v4"' index.html
          grep -F "async function restoreSession()" index.html
          grep -F "JACCDeviceBinding.withDevice('verifyLogin'" index.html
          grep -F "JACCDeviceBinding.withDevice('getData'" index.html
          python phase2/apply_website_device_binding.py index.html --check
          git diff --stat

      - name: Run repository tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r phase1/requirements_phase1.txt pytest
          python -m pytest phase1/tests -q

      - name: Commit generated index only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git diff --cached --name-only | grep -Fx "index.html"
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "1"
          git commit -m "Phase 2: generate device-bound website login"
          git push origin HEAD:agent/jacc-phase2-membership-audit
